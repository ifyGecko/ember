# ember for an x86-64 Linux host, cross-compiled (e.g. on AArch64 Linux):
#
#   meson setup build-x64 --cross-file cross/x86_64-linux-gnu.ini
#   meson compile -C build-x64
#
# The tests are host programs. To run them from the build machine, give meson the way to
# run an x86-64 program in a second cross file after this one: `exe_wrapper = [...]` under
# [binaries], or `needs_exe_wrapper = false` under [properties] when the system runs such
# programs directly (qemu-user or Rosetta registered with binfmt_misc). Otherwise run
# `meson test` on the x86-64 host itself.

[binaries]
c = 'x86_64-linux-gnu-gcc'
ar = 'x86_64-linux-gnu-ar'
strip = 'x86_64-linux-gnu-strip'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
