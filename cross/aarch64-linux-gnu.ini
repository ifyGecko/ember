# ember for an AArch64 Linux host, cross-compiled:
#
#   meson setup build-a64 --cross-file cross/aarch64-linux-gnu.ini
#   meson compile -C build-a64
#
# The tests are host programs. To run them from the build machine, give meson the way to
# run an AArch64 program in a second cross file after this one: `exe_wrapper = [...]` under
# [binaries], or `needs_exe_wrapper = false` under [properties] when the system runs such
# programs directly. Otherwise run `meson test` on the AArch64 host itself.

[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
